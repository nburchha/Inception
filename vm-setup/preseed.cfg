### Based on VirtualBox 7.1's own default Debian template
### (/usr/share/virtualbox/UnattendedTemplates/debian_preseed.cfg), with three
### fixes/additions for this project — search "CHANGED" below for the diffs.
### Passed to `VBoxManage unattended install` via --script-template so the rest
### of the (proven-working) generation logic, incl. Guest Additions, is untouched.

### Partitioning
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic

# This makes partman automatically partition without confirmation
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Locale
d-i debian-installer/locale string @@VBOX_INSERT_LOCALE@@
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us

# Network
d-i netcfg/get_hostname string @@VBOX_INSERT_HOSTNAME_WITHOUT_DOMAIN@@
d-i netcfg/get_domain string @@VBOX_INSERT_HOSTNAME_DOMAIN@@
d-i netcfg/choose_interface select auto

# Clock
@@VBOX_COND_IS_RTC_USING_UTC@@
d-i clock-setup/utc-auto boolean true
d-i clock-setup/utc boolean true
@@VBOX_COND_END@@
@@VBOX_COND_IS_NOT_RTC_USING_UTC@@
d-i clock-setup/utc-auto boolean false
d-i clock-setup/utc boolean false
@@VBOX_COND_END@@
d-i time/zone string @@VBOX_INSERT_TIME_ZONE_UX@@
@@VBOX_COND_IS_INSTALLING_ADDITIONS@@d-i clock-setup/ntp boolean false@@VBOX_COND_END@@
@@VBOX_COND_IS_NOT_INSTALLING_ADDITIONS@@d-i clock-setup/ntp boolean true@@VBOX_COND_END@@

# Packages, Mirrors, Image
d-i base-installer/kernel/override-image string linux-server
d-i base-installer/kernel/override-image string linux-image-amd64
d-i pkgsel/install-language-support boolean false

@@VBOX_COND_AVOID_UPDATES_OVER_NETWORK@@
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect updates
d-i netcfg/no_default_route true
d-i netcfg/get_nameservers ""
@@VBOX_COND_END@@

@@VBOX_COND_IS_NOT_MINIMAL_INSTALLATION@@
d-i apt-setup/restricted boolean true
d-i apt-setup/universe boolean true
@@VBOX_COND_END@@@@VBOX_COND_IS_MINIMAL_INSTALLATION@@
tasksel tasksel/first multiselect minimal
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select none
@@VBOX_COND_END@@

# CHANGED: the default template only adds openssh-server for a *minimal*
# install; a normal (Desktop) install gets whatever tasksel's own defaults are
# (Desktop/GNOME, but not ssh-server). Install everything this project needs
# as plain packages regardless of tasksel's picks — same native, always-in-
# target mechanism tasksel itself uses, so no extra risk. `sudo` is included
# defensively even though "standard system utilities" should already pull it
# in. `docker-compose` is Debian's own package name for the compose v2 plugin
# (not `docker-compose-plugin`, which only exists in Docker's own APT repo).
d-i pkgsel/include string openssh-server sudo docker.io docker-compose git firefox-esr curl

# Users
d-i passwd/user-fullname string @@VBOX_INSERT_USER_FULL_NAME@@
d-i passwd/username string @@VBOX_INSERT_USER_LOGIN@@
d-i passwd/user-password password @@VBOX_INSERT_USER_PASSWORD@@
d-i passwd/user-password-again password @@VBOX_INSERT_USER_PASSWORD@@
d-i passwd/root-login boolean true
d-i passwd/root-password password @@VBOX_INSERT_ROOT_PASSWORD@@
d-i passwd/root-password-again password @@VBOX_INSERT_ROOT_PASSWORD@@
d-i user-setup/allow-password-weak boolean true
# CHANGED: "admin" is Ubuntu's sudo group name; Debian's is "sudo". This one-word
# mismatch in the stock VirtualBox template is why sudo never worked before.
d-i passwd/user-default-groups string sudo

# Grub
d-i grub-installer/grub2_instead_of_grub_legacy boolean true
d-i grub-installer/only_debian boolean true

# Due notably to potential USB sticks, the location of the MBR can not be
# determined safely in general, so this needs to be specified:
#d-i grub-installer/bootdev  string /dev/sda
# To install to the first device (assuming it is not a USB stick):
d-i grub-installer/bootdev  string default

d-i finish-install/reboot_in_progress note

# Custom Commands.
# Note! Debian netboot images use busybox, so no bash.
#       Tell script to use target bash.
# CHANGED: appended our own `in-target` steps (Debian's own documented helper
# for running one-off commands chrooted into /target from late_command) after
# VirtualBox's existing Guest Additions install — docker group, /etc/hosts for
# the project's TLS vhost, and cloning the Inception repo so it's ready on
# first boot. All plain, standard commands; nothing installer-internal.
d-i preseed/late_command string cp /cdrom/vboxpostinstall.sh /target/root/vboxpostinstall.sh \
 && chmod +x /target/root/vboxpostinstall.sh \
 && /bin/sh /target/root/vboxpostinstall.sh --need-target-bash --preseed-late-command \
 && in-target usermod -aG docker @@VBOX_INSERT_USER_LOGIN@@ \
 && in-target sh -c "echo '127.0.0.1 nburchha.42.fr' >> /etc/hosts" \
 && in-target git clone https://github.com/nburchha/Inception.git /home/@@VBOX_INSERT_USER_LOGIN@@/Inception \
 && in-target chown -R @@VBOX_INSERT_USER_LOGIN@@:@@VBOX_INSERT_USER_LOGIN@@ /home/@@VBOX_INSERT_USER_LOGIN@@/Inception
