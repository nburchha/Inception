version: "3.8"

services:
  nginx:
    build: requirements/nginx/
    image: nginx # after build directive, therefore thats the name of the builded image, an other image.
    container_name: nginx
    depends_on:
      wordpress:
        condition: service_healthy
      static_site:
        condition: service_started
      gatus:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - web:/var/www/html
    networks:
      - inception
    restart: always
    env_file: ".env"
    healthcheck:
      # nginx generates its self-signed cert before exec'ing, so "container
      # started" isn't "accepting TLS" -- do a real TLSv1.2 handshake.
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    image: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - web:/var/www/html
    networks:
      - inception
    restart: always
    env_file: ".env"
    healthcheck:
      # script.sh runs the entire `wp core install`/plugin-activation sequence
      # before its final `exec php-fpm8.2 -F`, so port 9000 only starts
      # accepting connections once that whole install has finished -- this is
      # a genuine "WordPress is ready" signal, not just "container started".
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/wordpress/9000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  mariadb:
    build: requirements/mariadb/
    container_name: mariadb
    image: mariadb
    volumes:
      - database:/var/lib/mysql
    networks:
      - inception
    restart: always
    env_file: ".env"
    healthcheck:
      test: ["CMD", "mysqladmin", ping, "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  redis:
    build: requirements/redis/
    container_name: redis
    image: redis
    networks:
      - inception
    restart: always
    env_file: ".env"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping | grep -x PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  ftp:
    build: requirements/ftp/
    container_name: ftp
    image: ftp
    ports:
      - "21:21"
      - "40000-40005:40000-40005"
    volumes:
      - web:/var/www/html
    networks:
      - inception
    restart: always
    env_file: ".env"
    depends_on:
      - wordpress

  static_site:
    build: requirements/static_site/
    container_name: static_site
    image: static_site
    networks:
      - inception
    restart: always
    env_file: ".env"

  adminer:
    build: requirements/adminer/
    container_name: adminer
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: always
    env_file: ".env"
    depends_on:
      mariadb:
        condition: service_healthy

  gatus:
    build: requirements/gatus/
    container_name: gatus
    image: gatus
    volumes:
      - gatus_data:/app/data
    networks:
      - inception
    restart: always
    env_file: ".env"

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  web:
    name: web
    driver_opts:
      type: none
      o: bind
      device: ${WEB_VOLUME_PATH}
  database:
    name: database
    driver_opts:
      type: none
      o: bind
      device: ${DATABASE_VOLUME_PATH}
  gatus_data:
    name: gatus_data
    driver_opts:
      type: none
      o: bind
      device: ${GATUS_VOLUME_PATH}